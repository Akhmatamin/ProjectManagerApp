name: CI and Deployment
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build docker image and run tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-backend-app:latest .
        
      - name: Run Tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: test_db
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password

          SECRET_KEY: fake_secret_key_for_ci_only
          ALGORITHM: HS256
          ACCESS_TOKEN_LIFETIME: 3600
          REFRESH_TOKEN_LIFETIME: 86400
          RESEND_API_KEY: fake_resend_api_key_for_ci

          AWS_ACCESS_KEY_ID: fake_aws_access_key_for_ci
          AWS_SECRET_ACCESS_KEY: fake_aws_secret_key_for_ci
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: fake_s3_bucket_for_ci

          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          docker run --network host \
            -e DATABASE_HOST=$DATABASE_HOST \
            -e DATABASE_PORT=$DATABASE_PORT \
            -e DATABASE_NAME=$DATABASE_NAME \
            -e DATABASE_USER=$DATABASE_USER \
            -e DATABASE_PASSWORD=$DATABASE_PASSWORD \
            -e SECRET_KEY=$SECRET_KEY \
            -e ALGORITHM=$ALGORITHM \
            -e ACCESS_TOKEN_LIFETIME=$ACCESS_TOKEN_LIFETIME \
            -e REFRESH_TOKEN_LIFETIME=$REFRESH_TOKEN_LIFETIME \
            -e RESEND_API_KEY=$RESEND_API_KEY \
            -e REDIS_HOST=$REDIS_HOST \
            -e REDIS_PORT=$REDIS_PORT \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION=$AWS_REGION \
            -e S3_BUCKET_NAME=$S3_BUCKET_NAME \
            my-backend-app:latest \
            bash -c "uv run alembic upgrade head && uv run pytest tests/"

      - name: login to github container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          docker tag my-backend-app:latest $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest


      - name: Test SSH connection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2"
            whoami
            hostname
            docker --version

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/projectmanager
            docker compose pull api
            docker compose run --rm api uv run alembic upgrade head
            docker compose up -d 
            
            sleep 10
            curl --fail http://localhost/docs
          
            docker compose ps
