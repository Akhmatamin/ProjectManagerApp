services:
  api:
    image: ghcr.io/akhmatamin/projectmanagerapp:latest

    env_file:
      - .env

    expose:
      - "8000"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


volumes:
  redis_data: